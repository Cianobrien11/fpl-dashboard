<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL IQ — Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{
    background:linear-gradient(180deg,#38035a,#ad1487);
    color:#fff;font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .card{max-width:360px}
  .logo{font-size:52px;font-weight:900;letter-spacing:2px;margin-bottom:4px}
  .bar{width:90px;height:6px;background:#37e6a4;border-radius:4px;margin:10px auto 22px}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;opacity:.85;line-height:1.5;margin:0 0 22px}
  button{
    background:#37e6a4;color:#08130d;border:none;border-radius:10px;
    padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">FPL</div>
    <div class="bar"></div>
    <h1>You're offline</h1>
    <p>FPL IQ needs an internet connection to pull the latest stats, fixtures and prices. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
