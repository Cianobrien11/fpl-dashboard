name: Daily + Post-Match Data Refresh

# Daily refresh of the FPL dashboard.
#  1. Wake + trigger the app's own refresh (FPL API stats, fixtures, prices).
#  2. Pull REAL shots/key-passes, team xG/xGA and H2H from Understat (via
#     understatapi) on GitHub's runners — Understat serves the full data page
#     to GitHub but not to a cloud host like Render — and POST via /ingest/*.
# Runs every day at 07:00 UTC — plus a manual "Run workflow" trigger.
#
# Resilience: the app on Render's free tier SLEEPS after 15 min idle and can
# take ~50s to wake, returning errors on the first hit. So we (a) ping to wake
# it, (b) retry the refresh, and (c) mark steps `continue-on-error` so a
# transient refresh hiccup never blocks the all-important Understat ingest.
on:
  schedule:
    # Daily baseline (08:00 UK summer time / 07:00 winter)
    - cron: "0 7 * * *"
    # POST-MATCH refreshes (times in UTC; ~2h after each usual PL kick-off).
    # Saturday: after the 12:30, 15:00, 17:30 and 20:00 UK kick-offs
    - cron: "30 13,16,18,21 * * 6"
    # Sunday: after the 14:00 and 16:30 UK kick-offs
    - cron: "30 15,18 * * 0"
    # Mon/Tue/Wed/Fri evenings: after 19:30-20:00 UK kick-offs
    - cron: "30 21 * * 1,2,3,5"
  workflow_dispatch: {}    # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Wake the app (free tier spins down when idle)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Waking app (free tier can take ~50s to spin up)..."
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL/" || echo "000")
            echo "Wake ping $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "App is awake."; break; fi
            echo "Not ready yet, waiting 15s..."; sleep 15
          done
          exit 0

      - name: Trigger the app refresh (FPL stats + fixtures), with retries
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          # Build the refresh URL from the CRON_TOKEN env var in-shell, so no
          # literal token lives in this file. curl errors are swallowed and the
          # step always exits 0 (no red annotation on cold-start hiccups).
          url="$APP_URL/cron/refresh?token=$CRON_TOKEN"
          ok=0
          for i in 1 2 3 4 5; do
            echo "Refresh attempt $i of 5..."
            code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 120 "$url" || true)
            echo "HTTP ${code:-none}"; cat /tmp/resp.txt 2>/dev/null || true; echo ""
            if [ "$code" = "200" ]; then echo "Refresh OK"; ok=1; break; fi
            echo "Not ready, retrying in 20s..."; sleep 20
          done
          if [ "$ok" = "1" ]; then echo "::notice::App refresh succeeded."; else echo "::warning::Refresh slow to return 200 (cold start); ingest still runs."; fi
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests understatapi

      - name: Pull Understat data (shots, team xG/xGA, H2H) and post to the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: python fbref_action.py

      - name: Pull bookmaker odds (clean-sheet / goals signals) and post to the app
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python odds_action.py || echo "::warning::Odds step had a non-fatal issue; continuing."
          exit 0

      - name: Log per-GW player history (accuracy foundation)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          BACKFILL: ${{ vars.HISTORY_BACKFILL }}
        run: |
          python history_action.py || echo "::warning::History step had a non-fatal issue; continuing."
          exit 0
