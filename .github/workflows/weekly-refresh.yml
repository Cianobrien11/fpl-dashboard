name: Daily Data Refresh

# Daily refresh of the FPL dashboard.
#  1. Trigger the app's own refresh (FPL API stats, fixtures, prices).
#  2. Pull REAL shots/key-passes from Understat (via understatapi) on GitHub's
#     runners — Understat serves the full data page to GitHub but not to a
#     cloud host like Render — and POST the numbers to /ingest/shots.
# Runs every day at 07:00 UTC — plus a manual "Run workflow" trigger.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC every day
  workflow_dispatch: {}    # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Trigger the app refresh (FPL stats + fixtures)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          echo "Calling app refresh endpoint..."
          curl --fail-with-body --max-time 180 \
               "$APP_URL/cron/refresh?token=[REDACTED_PARAM]
          echo ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests understatapi

      - name: Pull real shots from Understat and post to the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: python fbref_action.py
