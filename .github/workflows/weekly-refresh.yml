name: Weekly Data Refresh

# Weekly refresh of the FPL dashboard.
#  1. Trigger the app's own refresh (FPL API stats, fixtures, prices).
#  2. Scrape FBRef shots/SoT/key-passes from GitHub's runners (FBRef blocks
#     these far less than a cloud host like Render) and POST the real numbers
#     to the app's /ingest/shots endpoint.
# Runs twice weekly — Friday & Tuesday 07:00 UTC — plus manual trigger.
on:
  schedule:
    - cron: "0 7 * * 5"   # 07:00 UTC every Friday (before the weekend deadline)
    - cron: "0 7 * * 2"   # 07:00 UTC every Tuesday (catch midweek fixtures/prices)
  workflow_dispatch: {}    # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Trigger the app refresh (FPL stats + fixtures)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          echo "Calling app refresh endpoint..."
          curl --fail-with-body --max-time 180 \
               "$APP_URL/cron/refresh?token=[REDACTED_PARAM]
          echo ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests pandas lxml

      - name: Scrape FBRef shots and post to the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: python fbref_action.py
