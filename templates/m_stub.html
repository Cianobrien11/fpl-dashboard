{% extends "mobile_base.html" %}
{% block title %}FPL IQ — {{ title }}{% endblock %}
{% block content %}
<style>
  .soon{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 20px;color:var(--muted)}
  .soon .icon{width:64px;height:64px;border-radius:18px;margin-bottom:16px;
    background:linear-gradient(135deg,var(--p1),var(--p2));display:flex;align-items:center;justify-content:center}
  .soon .icon svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2}
  .soon h2{color:var(--text);font-size:20px;font-weight:800;margin-bottom:8px}
  .soon p{font-size:13px;line-height:1.55;max-width:300px}
  .soon .tag{margin-top:14px;background:var(--surface2);color:var(--accent);font-size:11px;font-weight:800;
    padding:6px 13px;border-radius:100px;letter-spacing:.05em;text-transform:uppercase}
  .feat{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-top:10px;text-align:left;width:100%;max-width:340px}
  .feat li{font-size:13px;color:var(--text);margin:7px 0;list-style:none;display:flex;gap:9px;align-items:center}
  .feat li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
</style>
<div class="soon">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
  </div>
  <h2>{{ title }}</h2>
  <p>{{ blurb }}</p>
  <div class="tag">Coming next</div>
  {% if features %}
  <ul class="feat">
    {% for f in features %}<li>{{ f }}</li>{% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
