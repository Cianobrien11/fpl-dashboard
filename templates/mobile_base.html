<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}FPL IQ{% endblock %}</title>
<!-- PWA / installable app (FPL IQ) -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<meta name="theme-color" content="#38035a">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FPL IQ">
<style>
:root{
  --bg:#0b0f1a;--surface:#141b2b;--surface2:#1d2740;--border:#28334d;
  --text:#eef2fb;--muted:#8a97b4;
  --p1:#38035a;--p2:#ad1487;--accent:#37e6a4;--accent2:#2bd18f;
  --easy-bg:#123524;--easy:#4ade80;--mid-bg:#3a3410;--mid:#fbbf24;--hard-bg:#3a1518;--hard:#f87171;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  overscroll-behavior-y:none}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
a{text-decoration:none;color:inherit}

/* Top app bar */
.appbar{position:sticky;top:0;z-index:40;
  background:linear-gradient(120deg,var(--p1),var(--p2));
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.35)}
.appbar .brand{font-size:19px;font-weight:900;letter-spacing:.5px;color:#fff;display:flex;align-items:center;gap:7px}
.appbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.appbar .gw{margin-left:auto;font-size:12px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.16);padding:5px 11px;border-radius:100px}

/* Content */
.screen{padding:16px 14px 8px;max-width:560px;margin:0 auto}
.sec-label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:18px 4px 9px}
.sec-label:first-child{margin-top:4px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px}
.card.grad{background:linear-gradient(135deg,var(--p1),var(--p2));border:none}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(13,18,30,.92);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:10px;font-weight:700;padding:8px 0 4px;transition:.15s}
.tab svg{width:23px;height:23px;stroke:var(--muted);fill:none;stroke-width:2;transition:.15s}
.tab.active{color:var(--accent)}
.tab.active svg{stroke:var(--accent)}

.btn-accent{display:block;width:100%;text-align:center;background:var(--accent);color:#06130d;
  font-weight:800;font-size:14px;padding:13px;border-radius:12px;border:none;margin-top:4px}
</style>
</head>
<body>
<div class="appbar">
  <div class="brand"><span class="dot"></span> FPL IQ</div>
  {% if gw %}<div class="gw">GW{{ gw }}</div>{% endif %}
</div>

<main class="screen">
  {% block content %}{% endblock %}
</main>

<nav class="tabbar">
  <a class="tab {{ 'active' if tab=='home' }}" href="{{ url_for('m_home') }}">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    Home
  </a>
  <a class="tab {{ 'active' if tab=='players' }}" href="{{ url_for('m_players') }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
    Players
  </a>
  <a class="tab {{ 'active' if tab=='planner' }}" href="{{ url_for('m_planner') }}">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    Planner
  </a>
  <a class="tab {{ 'active' if tab=='team' }}" href="{{ url_for('m_team') }}">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
    My Team
  </a>
  <a class="tab {{ 'active' if tab=='analytics' }}" href="{{ url_for('m_analytics') }}">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Analytics
  </a>
</nav>

<script>
// Register the service worker on real deployments. Wrapped in try/catch because
// some sandboxed/preview contexts throw a SecurityError synchronously (which a
// .catch() on the promise would not cover).
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    try {
      navigator.serviceWorker.register('/service-worker.js').catch(function(){});
    } catch (e) { /* preview / unsupported context — ignore */ }
  });
}
</script>
</body>
</html>
